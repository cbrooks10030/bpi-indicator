name: Web CI

on:
  pull_request:
    paths: ['web/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
